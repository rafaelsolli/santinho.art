<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 34px;
    padding: 0 88px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1b1712;
    background:
      radial-gradient(120% 70% at 50% 0%, #f9f3e9 0%, transparent 60%),
      repeating-linear-gradient(135deg, rgba(0,0,0,.02) 0 3px, transparent 3px 7px),
      #efe7da;
  }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -.035em; line-height: .95; }
  h1 span { color: #c81d25; }
  p.sub { font-size: 27px; font-weight: 700; letter-spacing: .3em; color: #6a6055; margin-top: 14px; }
  p.claim { font-size: 34px; font-weight: 600; color: #3b332a; }
  .cards { display: grid; gap: 16px; max-width: 780px; }
  .card {
    position: relative; overflow: hidden;
    height: 104px; display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 30px; padding-right: 30px;
    background: #fffdf8; border-radius: 13px;
    box-shadow: 0 2px 0 rgba(0,0,0,.14), 0 14px 26px -20px rgba(0,0,0,.6);
  }
  .band { position: absolute; inset: 0 auto 0 0; width: 104px;
          clip-path: polygon(0 0, 100% 0, 58% 100%, 0 100%); }
  .photo { position: relative; width: 61px; height: 81px; margin-left: 20px; border-radius: 6px;
           background: linear-gradient(160deg, #fff, #e2d8c6);
           box-shadow: 0 0 0 3px rgba(255,255,255,.95); display: grid; place-items: center;
           font-size: 34px; font-weight: 800; color: #b3a89a; }
  .id { display: grid; gap: 7px; }
  .nome { font-size: 33px; font-weight: 800; letter-spacing: -.01em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .selo { font-size: 17px; font-weight: 800; letter-spacing: .06em; color: #fff;
          padding: 5px 8px; border-radius: 4px; }
  .cargo { font-size: 16px; font-weight: 700; letter-spacing: .1em; color: #6a6055; }
  .num { font-size: 62px; font-weight: 800; letter-spacing: -.02em;
         font-variant-numeric: tabular-nums; padding: 0 14px; border-radius: 5px; }
  .sep { border-left: 4px dotted rgba(0,0,0,.28); margin: 0 6px; align-self: stretch; }
  .tag { font-size: 19px; font-weight: 800; letter-spacing: .07em; padding: 6px 11px;
         border-radius: 4px; justify-self: start; }
</style>
