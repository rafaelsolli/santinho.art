<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>santinho.art — sua cola eleitoral para 2026</title>
<meta name="description" content="Monte e compartilhe sua cola eleitoral para 2026.">
<meta name="theme-color" content="#ececee">
<meta name="color-scheme" content="light">

<meta property="og:type" content="website">
<meta property="og:site_name" content="santinho.art">
<meta property="og:title" content="santinho.art — sua cola eleitoral para 2026">
<meta property="og:description" content="Monte e compartilhe sua cola eleitoral para 2026.">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://santinho.art/">
<!-- URL absoluta: os scrapers de OG não resolvem caminho relativo.
     Publicando em outro domínio, ajuste esta linha e a twitter:image. -->
<meta property="og:image" content="https://santinho.art/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="santinho.art — dois mini santinhos eleitorais em cinza, com números de exemplo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="santinho.art — sua cola eleitoral para 2026">
<meta name="twitter:description" content="Monte e compartilhe sua cola eleitoral para 2026.">
<meta name="twitter:image" content="https://santinho.art/og.png">

<!-- marca neutra: o ícone anterior trazia "13" em vermelho, que é número de
     partido real — o produto não pode carregar identidade de legenda (§46) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='11' fill='%2317181b'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial,sans-serif' font-size='33' font-weight='bold' fill='%23fbfbfc' text-anchor='middle'%3E00%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <h1 class="brand-name">santinho<span class="brand-sufixo">.art</span></h1>
  </div>

  <div class="controls">
    <!-- clicar no estado aqui em cima também puxa a ficha -->
    <button id="uf-placa-trigger" class="uf-placa-botao" type="button"
            aria-haspopup="dialog" aria-expanded="false">
      <span class="uf-placa">
        <img id="uf-flag" class="uf-flag" alt="" width="30" height="21" decoding="async">
        <span id="uf-sigla" class="uf-sigla"></span>
      </span>
    </button>

    <!-- aria-label mais descritivo que o rótulo visível, contendo-o (WCAG 2.5.3) -->
    <button id="share" class="share" type="button" aria-label="Compartilhar minha cola eleitoral">
      <svg viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="17" stroke-linecap="round">
        <circle cx="176" cy="60" r="28"/>
        <circle cx="176" cy="196" r="28"/>
        <circle cx="64" cy="128" r="28"/>
        <line x1="89" y1="115" x2="151" y2="73"/>
        <line x1="89" y1="141" x2="151" y2="183"/>
      </svg>
      <span class="share-rotulo">Compartilhar</span>
    </button>
  </div>

  <p class="tagline">nada impresso: nem voto, nem santinho</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>

<main class="cards" id="cards"></main>

<footer class="rodape">
  <!-- o rótulo fica DENTRO do botão: texto ao lado não seria clicável -->
  <button id="uf-trigger" class="uf-trigger aba" type="button" aria-haspopup="dialog" aria-expanded="false">
    <!-- alfinete de mapa, equivalente ao MapPin (Phosphor), desenhado inline -->
    <svg viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 36c-38 0-68 30-68 68 0 52 68 116 68 116s68-64 68-116c0-38-30-68-68-68Z"/>
      <circle cx="128" cy="102" r="24"/>
    </svg>
    <span class="rotulo-botao">trocar estado</span>
  </button>

  <button id="busca-trigger" class="busca-botao aba" type="button" aria-haspopup="dialog"
          aria-expanded="false" aria-label="Buscar por nome do candidato">
    <svg viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="20" stroke-linecap="round">
      <circle cx="112" cy="112" r="68"/><line x1="161" y1="161" x2="212" y2="212"/>
    </svg>
    <span class="rotulo-botao">buscar por nome</span>
  </button>
</footer>

<dialog id="uf-dialog" class="uf-dialog" aria-labelledby="uf-dialog-title">
 <div class="folha-corpo">
  <div class="uf-dialog-head busca-head">
    <h2 class="uf-dialog-title sr-only" id="uf-dialog-title">Escolha o estado</h2>
    <div class="busca-campo">
      <svg class="busca-lupa" viewBox="0 0 256 256" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="22" stroke-linecap="round">
        <circle cx="112" cy="112" r="68"/><line x1="161" y1="161" x2="212" y2="212"/>
      </svg>
      <input id="uf-busca" class="busca-input" type="text" autocomplete="off"
             autocorrect="off" spellcheck="false" enterkeyhint="search"
             placeholder="nome do estado" aria-label="Filtrar estados por nome">
    </div>
    <button id="uf-close" class="uf-close" type="button" aria-label="Fechar">
      <svg viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round">
        <line x1="72" y1="72" x2="184" y2="184"/><line x1="184" y1="72" x2="72" y2="184"/>
      </svg>
    </button>
  </div>
  <p class="busca-contagem" id="uf-contagem" role="status" aria-live="polite"></p>
  <ul class="uf-list" id="uf-list"></ul>
 </div>
</dialog>

<dialog id="busca-dialog" class="uf-dialog busca-dialog" aria-labelledby="busca-titulo">
 <div class="folha-corpo">
  <div class="uf-dialog-head busca-head">
    <h2 class="uf-dialog-title sr-only" id="busca-titulo">Buscar candidato por nome</h2>
    <div class="busca-campo">
      <svg class="busca-lupa" viewBox="0 0 256 256" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="22" stroke-linecap="round">
        <circle cx="112" cy="112" r="68"/><line x1="161" y1="161" x2="212" y2="212"/>
      </svg>
      <!-- type="text", não "search": o navegador faz o Escape limpar o campo em
           vez de fechar o diálogo, e o botão nativo de limpar já estava oculto -->
      <input id="busca-input" class="busca-input" type="text" autocomplete="off"
             autocorrect="off" spellcheck="false" enterkeyhint="search"
             placeholder="nome do candidato" aria-describedby="busca-contagem">
    </div>
    <button id="busca-close" class="uf-close" type="button" aria-label="Fechar">
      <svg viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round">
        <line x1="72" y1="72" x2="184" y2="184"/><line x1="184" y1="72" x2="72" y2="184"/>
      </svg>
    </button>
  </div>
  <p class="busca-contagem" id="busca-contagem" role="status" aria-live="polite"></p>
  <ul class="busca-lista" id="busca-lista"></ul>
 </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
